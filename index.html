<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content-Security-Policy is set as an HTTP response header (see scripts/generate-headers.mjs
      and the generated dist/_headers), not here. A header-based CSP can be hash-pinned against
      the actual built inline script and covers directives (frame-ancestors, etc.) that a <meta>
      CSP cannot enforce. Keeping only one CSP source avoids two policies silently conflicting.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Mimô Cookies</title>
    <meta name="description" content="Cookies artesanais premium. Edição especial de Páscoa com sabores exclusivos. Faça seu pedido pelo WhatsApp!" />
    <meta name="author" content="Mimô Cookies" />
    <meta property="og:title" content="Mimô Cookies — Cardápio de Páscoa" />
    <meta property="og:description" content="Cookies artesanais premium. Edição especial de Páscoa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,400&display=block" rel="stylesheet" />
    <style>
      #mimo-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5e0d8;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #mimo-loading.mimo-loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Grain texture */
      #mimo-loading::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.04'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
        pointer-events: none;
        z-index: 0;
      }

      /* Vignette */
      #mimo-loading::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(90,40,25,0.15) 100%);
        pointer-events: none;
        z-index: 1;
      }

      #mimo-loading > * { position: relative; z-index: 2; }
      .mimo-wave-top, .mimo-wave-bottom { position: absolute; left: 0; width: 100%; height: 40px; z-index: 3; }
      .mimo-wave-top { top: 0; }
      .mimo-wave-bottom { bottom: 0; }

      /* Easter text */
      .mimo-easter-text {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 0.95rem;
        color: #a67c5b;
        margin-bottom: 20px;
        opacity: 0;
        animation: mimo-fade-up 0.3s ease-out 0.1s forwards;
        letter-spacing: 0.5px;
      }

      /* Logo */
      .mimo-logo-wrap {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow:
          0 0 24px rgba(201,169,110,0.5),
          0 0 48px rgba(201,169,110,0.25),
          0 8px 32px rgba(201,150,122,0.35);
        opacity: 0;
        animation: mimo-logo-enter 0.3s ease-out 0.05s forwards;
        border: 2px solid rgba(201,169,110,0.3);
      }
      .mimo-logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Brand name */
      .mimo-brand-name {
        font-family: 'Pinyon Script', cursive;
        font-size: 2.2rem;
        color: #7a3d28;
        margin-top: 16px;
        margin-bottom: 4px;
        opacity: 0;
        animation: mimo-fade-up 0.3s ease-out 0.15s forwards;
      }

      /* Instagram */
      .mimo-instagram {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 0.9rem;
        color: #a67c5b;
        margin-bottom: 28px;
        opacity: 0;
        animation: mimo-fade-up 0.3s ease-out 0.2s forwards;
        letter-spacing: 0.3px;
      }

      /* Loading dots */
      .mimo-dots-wrap {
        display: flex;
        gap: 10px;
        opacity: 0;
        animation: mimo-fade-up 0.3s ease-out 0.25s forwards;
      }
      .mimo-dots-wrap span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #854d3b;
        animation: mimo-dot-pulse 1.2s ease-in-out infinite;
      }
      .mimo-dots-wrap span:nth-child(2) { animation-delay: 0.2s; }
      .mimo-dots-wrap span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes mimo-fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes mimo-logo-enter {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes mimo-dot-pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>

  <body>
    <div id="mimo-loading">
      <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;display:block;"><path d="M0 0 L1440 0 L1440 40 Q1080 80 720 40 Q360 0 0 40 Z" fill="#854d3b"/></svg>
      <div class="mimo-easter-text">Edição Especial Páscoa</div>
      <div class="mimo-logo-wrap">
        <img src="/images/logo-loading.png" alt="Mimô Cookies" />
      </div>
      <div class="mimo-brand-name">Mimô Cookies</div>
      <div class="mimo-instagram">Instagram: @mimo_cookiess</div>
      <div class="mimo-dots-wrap"><span></span><span></span><span></span></div>
      <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="position:absolute;bottom:0;left:0;width:100%;display:block;"><path d="M0 80 L1440 80 L1440 40 Q1080 0 720 40 Q360 80 0 40 Z" fill="#854d3b"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var el = document.getElementById('mimo-loading');
        if (!el) return;
        function hide() {
          if (el.classList.contains('mimo-loaded')) return;
          el.classList.add('mimo-loaded');
          setTimeout(function() { el.remove(); }, 300);
        }
        var bgImage = new Image();
        bgImage.src = '/images/header-bg.jpg';
        var timeout = new Promise(function(resolve) { setTimeout(resolve, 2800); });
        var imgReady = new Promise(function(resolve) {
          if (bgImage.complete) return resolve();
          bgImage.onload = resolve;
          bgImage.onerror = resolve;
        });
        var videoReady = new Promise(function(resolve) {
          var check = function(v) {
            if (!v) return resolve();
            if (v.readyState >= 4) return resolve();
            v.addEventListener('canplaythrough', resolve, { once: true });
            v.addEventListener('error', resolve, { once: true });
          };
          var v = document.querySelector('#hero video');
          if (v) return check(v);
          var observer = new MutationObserver(function() {
            var v = document.querySelector('#hero video');
            if (v) { observer.disconnect(); check(v); }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        });
        Promise.race([
          Promise.all([imgReady, videoReady]),
          timeout
        ]).then(hide);
      })();
    </script>
  </body>
</html>
